; ============================================================
; Overrides the base m1k1o/neko:chromium image's own
; /etc/neko/supervisord/chromium.conf to add Chrome DevTools
; Protocol (CDP) remote debugging flags. The base image's default
; chromium program has NO --remote-debugging-port, so our CDP
; automation API (api_v2.py, talking to 127.0.0.1:9222) had nothing
; to connect to. Everything else here (env vars, display, user-data-dir,
; openbox) is copied verbatim from the base image — only the CDP flags
; are new.
; ============================================================

[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/chromium
  --no-sandbox
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/home/neko/.config/chromium
  --no-first-run
  --start-maximized
  --bwsi
  --force-dark-mode
  --disable-file-system
  --disable-gpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
  --remote-debugging-port=9222
  --remote-debugging-address=0.0.0.0
  --remote-allow-origins=*
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
