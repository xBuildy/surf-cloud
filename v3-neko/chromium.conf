; ============================================================
; Overrides the base m1k1o/neko:chromium image's own
; /etc/neko/supervisord/chromium.conf to (a) add Chrome DevTools
; Protocol (CDP) remote debugging flags, and (b) fix the wedged
; New Tab Page.
;
; The base image launches Chromium with --bwsi (Browse Without Sign In /
; guest) and lets it open on the default NTP (chrome://newtab). On this
; build the NTP's renderer wedges (repeated "incorrect profile type" +
; GCM PHONE_REGISTRATION_ERROR log spam) — and a wedged renderer means
; Page.enable over that page's CDP socket NEVER returns, which is what
; made every /navigate hang for the full timeout window.
;
; Fix: drop --bwsi, open directly on about:blank (a clean, responsive
; page target), and disable the NTP background services that were
; phoning home. Everything else (display/user-data-dir/openbox) is the
; base image's own config, plus the CDP flags we need.
;
; NOTE: CDP is bound to loopback (127.0.0.1) ONLY — no --remote-debugging-address=0.0.0.0.
; Binding CDP to 0.0.0.0 puts Chrome into a hardened 'remote debugging' posture
; that returns -32000 'Not allowed' for Target.attachToTarget and silently
; refuses to service page-level sockets, EVEN for loopback clients. Our API and
; nginx both dial 127.0.0.1:9222 from inside the container, so loopback is enough.
; ============================================================

[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/chromium
  --no-sandbox
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/home/neko/.config/chromium
  --no-first-run
  --no-default-browser-check
  --start-maximized
  --force-dark-mode
  --disable-file-system
  --disable-gpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
  --disable-sync
  --disable-features=Translate,MediaRouter,OptimizationHints
  --remote-debugging-port=9222
  --remote-allow-origins=*
  about:blank
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
