<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Surf</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
</head>
<body>
    <div id="app">
        <!-- Top Toolbar -->
        <div id="toolbar">
            <div class="toolbar-left">
                <button id="back-btn" class="nav-btn" title="Back">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <button id="forward-btn" class="nav-btn" title="Forward">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <button id="reload-btn" class="nav-btn" title="Reload">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                </button>
                <button id="home-btn" class="nav-btn" title="Home">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
                </button>
            </div>

            <div class="address-bar-container">
                <div id="address-bar">
                    <svg class="lock-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <input type="text" id="url-input" placeholder="Search Wave Search or type a URL" spellcheck="false">
                    <button id="go-btn" class="go-btn">Go</button>
                </div>
            </div>

            <div class="toolbar-right">
                <button id="ask-ai-btn" class="toolbar-btn ai-btn" title="Ask AI (Wave Assistant)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <span>Ask AI</span>
                </button>
                <button id="bookmarks-btn" class="toolbar-btn" title="Bookmarks">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
                </button>
                <button id="history-btn" class="toolbar-btn" title="History">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                </button>
                <button id="screenshot-btn" class="toolbar-btn" title="Screenshot">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <button id="fullscreen-btn" class="toolbar-btn" title="Fullscreen">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="main-content">
            <!-- Neko WebRTC Stream (the actual browser viewport) -->
            <div id="neko-container">
                <iframe id="neko-viewer" src="/neko/" allow="autoplay; clipboard-read; clipboard-write; fullscreen"></iframe>
            </div>

            <!-- AI Panel (slides in from right) -->
            <div id="ai-panel" class="hidden">
                <div class="ai-panel-header">
                    <div class="ai-panel-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        <span>Wave Assistant</span>
                    </div>
                    <button id="ai-close-btn" class="close-btn">&times;</button>
                </div>
                <div id="ai-messages"></div>
                <div class="ai-input-container">
                    <textarea id="ai-input" placeholder="Ask me to automate anything..." rows="2"></textarea>
                    <button id="ai-send-btn" class="send-btn">Send</button>
                </div>
            </div>

            <!-- Bookmarks Sidebar (slides in from left) -->
            <div id="bookmarks-panel" class="hidden">
                <div class="sidebar-header">
                    <h3>Bookmarks</h3>
                    <button id="bookmarks-close-btn" class="close-btn">&times;</button>
                </div>
                <div id="bookmarks-list"></div>
            </div>

            <!-- History Sidebar (slides in from left) -->
            <div id="history-panel" class="hidden">
                <div class="sidebar-header">
                    <h3>History</h3>
                    <button id="history-close-btn" class="close-btn">&times;</button>
                </div>
                <div id="history-list"></div>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar">
            <span id="status-text">Ready</span>
            <span id="status-url"></span>
            <div class="status-right">
                <span id="connection-status" class="status-dot connected" title="WebRTC Connected"></span>
                <span id="fps-counter">60fps</span>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
