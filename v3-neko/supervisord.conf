; ============================================================
; Wave Surf — Supervisor Configuration
; Manages Neko + Chromium + Python CDP API (serves frontend too)
; Neko on 8081, our API on 8080 (proxies /neko to Neko)
; ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; Neko WebRTC Server (on port 8081, proxied by our API)
[program:neko]
command=/usr/bin/neko serve --port 8081
directory=/app
environment=NEKO_SCREEN="1920x1080@30",NEKO_AUDIO_BITRATE="128",NEKO_VIDEO_BITRATE="4000",NEKO_MAX_FPS="60",NEKO_PASSWORD="%(ENV_NEKO_PASSWORD)s",NEKO_ADMIN_PASSWORD="%(ENV_NEKO_ADMIN_PASSWORD)s",NEKO_CONTROL_PROTECTION="false",NEKO_IMPLICIT_CONTROL="true"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/neko.log
stderr_logfile=/var/log/supervisor/neko-error.log
priority=10

; Chromium Browser (CDP for automation)
[program:chromium]
command=/usr/bin/chromium-browser --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --remote-allow-origins=* --no-sandbox --disable-gpu-sandbox --disable-dev-shm-usage --force-device-scale-factor=1 --disable-background-networking --disable-extensions --disable-default-apps
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium-error.log
priority=20

; Python CDP API + static frontend server (port 8080, proxies /neko to 8081)
[program:cdp-api]
command=python3 -m uvicorn api.api_v2:app --host 0.0.0.0 --port 8080
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/cdp-api.log
stderr_logfile=/var/log/supervisor/cdp-api-error.log
priority=30
