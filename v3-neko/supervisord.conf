; ============================================================
; Wave Surf — Supervisor Configuration
; Manages Neko + Thorium + Python CDP API + nginx
; ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; Neko WebRTC Server (replaces noVNC)
[program:neko]
command=/usr/bin/neko serve
directory=/app
environment=NEKO_SCREEN="1920x1080@30",NEKO_AUDIO_BITRATE="128",NEKO_VIDEO_BITRATE="4000",NEKO_MAX_FPS="60",NEKO_PASSWORD="%(ENV_NEKO_PASSWORD)s",NEKO_ADMIN_PASSWORD="%(ENV_NEKO_ADMIN_PASSWORD)s",NEKO_CONTROL_PROTECTION="false",NEKO_IMPLICIT_CONTROL="true"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/neko.log
stderr_logfile=/var/log/supervisor/neko-error.log
priority=10

; Thorium Browser (replaces vanilla Chromium)
[program:thorium]
command=/usr/bin/chromium-browser --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --remote-allow-origins=* --no-sandbox --disable-gpu-sandbox --disable-dev-shm-usage --force-device-scale-factor=1 --disable-background-networking --disable-extensions --disable-default-apps
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/thorium.log
stderr_logfile=/var/log/supervisor/thorium-error.log
priority=20

; Python CDP API (automation endpoints: navigate, click, type, extract, observe, act, screenshot)
[program:cdp-api]
command=/usr/bin/python3 -m uvicorn api.api_v2:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/cdp-api.log
stderr_logfile=/var/log/supervisor/cdp-api-error.log
priority=30

; nginx reverse proxy (routes traffic to Neko viewer + CDP API + custom frontend)
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
priority=40
