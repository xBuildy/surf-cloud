# ============================================================
# Wave Surf — nginx Reverse Proxy
# Routes: / → Wave OS shell, /neko → Neko WebRTC, /api → CDP API
# ============================================================

upstream neko_backend {
    server 127.0.0.1:8081;
}

upstream cdp_api {
    server 127.0.0.1:8000;
}

server {
    listen 8080;
    server_name _;

    # Custom Wave OS frontend shell (address bar, bookmarks, Ask AI)
    location / {
        root /app/frontend;
        try_files $uri $uri/ /index.html;
        
        # Inject Wave OS theme headers
        add_header X-Wave-OS "Surf" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Neko WebRTC signaling + stream (replaces noVNC)
    location /neko/ {
        proxy_pass http://neko_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # WebSocket endpoints for Neko
    location ~ ^/(ws|wss)$ {
        proxy_pass http://neko_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # CDP Automation API (navigate, click, type, extract, observe, act, screenshot)
    location /api/ {
        proxy_pass http://cdp_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    # CDP raw endpoint (for Playwright/CDP clients)
    location /cdp {
        proxy_pass http://127.0.0.1:9222;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass http://cdp_api/health;
        access_log off;
    }

    # Screenshot endpoint (direct, no proxy needed — API handles it)
    location /screenshot {
        proxy_pass http://cdp_api/screenshot;
        proxy_set_header Host $host;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1000;
}
