# ============================================================
# Wave Surf — nginx Reverse Proxy
# Routes: / → Wave OS shell, /neko → Neko WebRTC, /api → CDP API
# ============================================================

upstream neko_backend {
    server 127.0.0.1:8081;
}

upstream cdp_api {
    server 127.0.0.1:8000;
}

server {
    listen 8080;
    server_name _;

    # Custom Wave OS frontend shell (address bar, bookmarks, Ask AI)
    location / {
        root /app/frontend;
        try_files $uri $uri/ /index.html;
        
        # Inject Wave OS theme headers.
        add_header X-Wave-OS "Surf" always;
        # Allow embedding inside the Wave OS shell. X-Frame-Options: SAMEORIGIN
        # blocked the iframe entirely ("refused to connect"). Use CSP
        # frame-ancestors to whitelist the Wave OS origins instead. NO
        # X-Frame-Options header (its presence overrides CSP in some browsers).
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.oswave.io https://oswave.io https://*.base44.app https://*.base44.com" always;
    }

    # Neko WebRTC signaling + stream (replaces noVNC)
    location /neko/ {
        proxy_pass http://neko_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Inject custom CSS into Neko HTML client to hide Neko chrome & force edge-to-edge video fill
        sub_filter_once off;
        sub_filter '</head>' '<style>html, body { margin: 0; background: #000; overflow: hidden; } header, .header, #neko-menu, .menu, .side, .controls, .connect, .overlay, [class*="logo"] { display: none !important; } video { width: 100% !important; height: 100% !important; object-fit: fill !important; }</style></head>';

        add_header Content-Security-Policy "frame-ancestors 'self' https://*.oswave.io https://oswave.io https://*.base44.app https://*.base44.com" always;
    }

    # WebSocket endpoints for Neko
    location ~ ^/(ws|wss)$ {
        proxy_pass http://neko_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # CDP Automation API (navigate, click, type, extract, observe, act, screenshot)
    location ~ ^/(api/|navigate|content|click|type|observe|act|extract|screenshot|resize|automate|back|forward|reload|session) {
        proxy_pass http://cdp_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    # CDP raw endpoint (for Playwright/CDP clients)
    # NOTE: Host header MUST be an IP or "localhost" — Chrome's DevTools
    # HTTP/WS server rejects any other Host as a security measure
    # ("Host header is specified and is not an IP address or localhost").
    # Forwarding the public Railway domain here (proxy_set_header Host $host)
    # made every /cdp request fail. $proxy_host resolves to the literal
    # upstream target (127.0.0.1:9222), which passes Chrome's check.
    location /cdp {
        proxy_pass http://127.0.0.1:9222;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
    }

    # Health check
    location /health {
        proxy_pass http://cdp_api/health;
        access_log off;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1000;
}
