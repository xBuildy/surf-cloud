; ============================================================
; Additional supervisor program — Python CDP automation API.
; This file is copied into /etc/neko/supervisord/ which the base
; image's own /etc/neko/supervisord.conf already [include]s via
; "files=/etc/neko/supervisord/*.conf" — so it merges cleanly
; alongside the base image's existing x-server/dbus/pulseaudio/
; neko/chromium/openbox programs without touching any of them.
;
; NOTE: directory is /app/api (not /app) and the app string is
; "api_v2:app" (not "api.api_v2:app") — api_v2.py does plain
; `import session_store` / `import ai_resolver`, which only resolve
; when /app/api itself is on sys.path (i.e. is the cwd uvicorn is
; launched from). Running from /app made those imports fail with
; ModuleNotFoundError.
; ============================================================

[program:cdp-api]
command=/usr/bin/python3 -m uvicorn api_v2:app --host 0.0.0.0 --port 8000
directory=/app/api
autostart=true
autorestart=true
priority=850
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
