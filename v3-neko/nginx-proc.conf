; ============================================================
; Additional supervisor program — nginx reverse proxy.
; See cdp-api.conf comment: merges into the base image's own
; /etc/neko/supervisord.conf [include] directory.
; nginx is the single public entrypoint (port 8080), proxying to
; the custom Wave OS frontend shell, the CDP API (port 8000), the
; Neko WebRTC viewer (now on port 8081, see NEKO_SERVER_BIND in the
; Dockerfile), and Chromium's CDP port (9222).
; ============================================================

[program:nginx]
; Render the live nginx config from the template at boot, substituting
; __SURF_API_KEY__ with the real SURF_API_KEY env value. This keeps the key
; OUT of the git repo and OUT of client-side JS -- the shell talks to
; /shell-api/ and nginx attaches the key server-side (see nginx.conf).
; Rendering from a pristine template (rather than sed -i on the live file)
; means rotating the Railway env var actually takes effect on restart
; instead of leaving a stale key baked in.
command=/bin/sh -c "sed \"s|__SURF_API_KEY__|${SURF_API_KEY}|g\" /etc/nginx/nginx.conf.template > /etc/nginx/sites-available/default && exec /usr/sbin/nginx -g 'daemon off;'"
autostart=true
autorestart=true
priority=850
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
