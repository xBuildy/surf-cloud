use_default_settings: true

general:
  instance_name: "Wave Search"
  debug: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "en-US"
  formats:
    - html
    - json

server:
  secret_key: "wave-search-secret-2026"
  bind_address: "0.0.0.0"
  port: 8080
  image_proxy: true
  http_protocol_version: "1.1"
  method: "POST"
  public_instance: false
  enable_metrics: false

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: true
  infinite_scroll: true
  center_alignment: true
  default_theme: "wave"
  theme_args:
    style: "wave-dark"

redis:
  url: false

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: github
    engine: github
    shortcut: gh
    disabled: false
  - name: stackoverflow
    engine: stackoverflow
    shortcut: so
    disabled: false
  - name: arxiv
    engine: arxiv
    shortcut: ar
    disabled: false
  - name: reddit
    engine: reddit
    shortcut: re
    disabled: false
  - name: youtube
    engine: youtube
    shortcut: yt
    disabled: false
  - name: news
    engine: news
    shortcut: nw
    disabled: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: "Wave Search"

brand:
  new_issue_url: ""
  docs_url: ""
  public_instances: ""
  wiki_url: ""
  issue_url: ""
